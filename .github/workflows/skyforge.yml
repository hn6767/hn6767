name: Generate Skyforge

on:
  schedule:
    # Run daily at 7:00 AM UTC (~midnight PDT)
    - cron: "0 7 * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate Skyforge GIF
        run: python generate.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add skyforge.gif
          git diff --staged --quiet || (git commit -m "Update Skyforge night sky [$(date -u +%Y-%m-%d)]" && git push)
